<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1500px;
      height: 880px;
      background: #1e1e2e;
      color: #cdd6f4;
      font-family: "Helvetica Neue", sans-serif;
      padding: 16px;
      overflow: hidden;
    }
    h2 {
      font-size: 14px;
      color: #89b4fa;
      margin-bottom: 12px;
    }
    .main-layout {
      display: flex;
      gap: 16px;
      height: calc(100% - 36px);
    }
    .left {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .right {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    label {
      font-size: 11px;
      color: #bac2de;
      display: block;
      margin-bottom: 4px;
    }
    textarea {
      width: 100%;
      flex: 1;
      background: #2a2a3e;
      color: #cdd6f4;
      border: 1px solid #45475a;
      border-radius: 6px;
      padding: 10px;
      font-size: 12px;
      resize: none;
      outline: none;
      line-height: 1.6;
    }
    textarea:focus { border-color: #89b4fa; }
    .btn-row {
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #btn-paste { background: #45475a; color: #cdd6f4; flex: 0 0 auto; padding: 10px 14px; }
    #btn-inject { background: #89b4fa; color: #1e1e2e; }
    #btn-generate { background: #a6e3a1; color: #1e1e2e; }
    .status {
      font-size: 11px;
      min-height: 16px;
      color: #a6e3a1;
    }
    .status.error { color: #f38ba8; }

    /* 944:2048比率 → 高さ820pxなら幅378px */
    .image-area {
      width: 378px;
      height: 820px;
      background: #2a2a3e;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      border: 1px solid #313244;
    }
    .image-area img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 6px;
      display: none;
    }
    .image-placeholder {
      color: #45475a;
      font-size: 12px;
      text-align: center;
      padding: 12px;
      line-height: 1.8;
    }
    .spinner {
      display: none;
      width: 32px;
      height: 32px;
      border: 3px solid #45475a;
      border-top-color: #89b4fa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      position: absolute;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h2>🎨 ComfyUI コントロール</h2>

  <div class="main-layout">
    <div class="left">
      <div style="display:flex;flex-direction:column;flex:1;">
        <label>ポジティブプロンプト</label>
        <textarea id="prompt-input" placeholder="プロンプトを入力..."></textarea>
      </div>
      <div class="btn-row">
        <button id="btn-paste">📋</button>
        <button id="btn-inject">ノードに反映</button>
        <button id="btn-generate">▶ 生成</button>
      </div>
      <div class="status" id="status"></div>
    </div>

    <div class="right">
      <label>生成画像</label>
      <div class="image-area" id="image-area">
        <div class="spinner" id="spinner"></div>
        <div class="image-placeholder" id="placeholder">ここに<br>生成画像が<br>表示されます</div>
        <img id="result-image" alt="生成画像">
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
