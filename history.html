<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>生成履歴</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #1e1e2e;
      color: #cdd6f4;
      font-family: "Helvetica Neue", sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 16px;
      gap: 12px;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }
    .toolbar h2 { font-size: 15px; color: #89b4fa; flex: 1; }
    button {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    .btn-refresh { background: #89b4fa; color: #1e1e2e; }
    .status { font-size: 11px; color: #6c7086; }
    .grid {
      flex: 1;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
      align-content: start;
    }
    .card {
      background: #2a2a3e;
      border: 1px solid #313244;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      transition: border-color 0.15s;
    }
    .card:hover { border-color: #89b4fa; }
    .card-img {
      width: 100%;
      height: 240px;
      object-fit: contain;
      background: #1e1e2e;
      display: block;
      flex-shrink: 0;
    }
    .card-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }
    .card-date { font-size: 10px; color: #6c7086; }
    .card-prompt {
      font-size: 13px;
      color: #cdd6f4;
      line-height: 1.5;
      max-height: 140px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 8;
      -webkit-box-orient: vertical;
      cursor: pointer;
      border-radius: 4px;
      padding: 4px;
      transition: background 0.15s;
    }
    .card-prompt:hover { background: #313244; }
    .card-prompt-edit {
      width: 100%;
      min-height: 100px;
      background: #1e1e2e;
      color: #cdd6f4;
      border: 1px solid #89b4fa;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
      resize: vertical;
      outline: none;
      line-height: 1.6;
    }
    .edit-actions { display: flex; gap: 6px; margin-top: 4px; }
    .btn-cancel-edit { background: #45475a; color: #cdd6f4; padding: 7px 10px; font-size: 11px; border-radius: 4px; border: none; cursor: pointer; }
    .card-seed { font-size: 10px; color: #89b4fa; }
    .card-actions { display: flex; gap: 6px; margin-top: auto; padding-top: 8px; }
    .btn-use { background: #a6e3a1; color: #1e1e2e; flex: 1; padding: 8px 4px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; width: 100%; }
    .btn-copy-prompt { background: #45475a; color: #cdd6f4; flex: 1; padding: 6px; font-size: 11px; }
    .card-status { font-size: 10px; min-height: 14px; color: #a6e3a1; }
    .card-status.error { color: #f38ba8; }
    .empty-msg { color: #45475a; font-size: 14px; text-align: center; padding: 60px; grid-column: 1/-1; }
  </style>
</head>
<body>
  <div class="container">
    <div class="toolbar">
      <h2>🖼 生成履歴</h2>
      <span class="status" id="status">読み込み中...</span>
      <button class="btn-refresh" id="btn-refresh">🔄 更新</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  <script src="history.js"></script>
</body>
</html>
