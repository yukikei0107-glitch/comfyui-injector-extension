<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>外部フレーズ集検索</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #1e1e2e;
      color: #cdd6f4;
      font-family: "Helvetica Neue", sans-serif;
      scrollbar-gutter: stable;
    }
    
    .container {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 20px;
      gap: 16px;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    
    h1 {
      font-size: 18px;
      color: #89b4fa;
    }
    
    .status {
      font-size: 12px;
      color: #6c7086;
    }
    
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .file-section {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    
    button {
      background: #89b4fa;
      color: #1e1e2e;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }
    
    button:hover {
      background: #a6e3a1;
    }
    
    #file-input {
      display: none;
    }
    
    .file-name {
      font-size: 12px;
      color: #a6e3a1;
      flex: 1;
    }
    
    .search-section {
      display: flex;
      gap: 8px;
    }
    
    input[type="text"] {
      flex: 1;
      background: #2a2a3e;
      color: #cdd6f4;
      border: 1px solid #45475a;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
    }
    
    input[type="text"]:focus {
      outline: none;
      border-color: #89b4fa;
    }
    
    .search-type {
      display: flex;
      gap: 6px;
    }
    
    .type-btn {
      flex: 0 0 auto;
      padding: 6px 10px;
      background: #45475a;
      color: #cdd6f4;
      border: 1px solid #313244;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
    }
    
    .type-btn.active {
      background: #89b4fa;
      color: #1e1e2e;
      border-color: #89b4fa;
    }
    
    .results {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border: 1px solid #313244;
      border-radius: 6px;
      padding: 8px;
      background: #252535;
    }
    
    .result-item {
      background: #2a2a3e;
      border: 1px solid #313244;
      border-radius: 4px;
      padding: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .result-item .jp {
      flex: 0 0 120px;
      font-size: 12px;
      font-weight: bold;
      color: #89b4fa;
      word-break: break-word;
    }
    
    .result-item .en {
      flex: 1;
      font-size: 12px;
      color: #cdd6f4;
      min-width: 0;
      word-break: break-word;
    }
    
    .result-item button {
      flex: 0 0 auto;
      padding: 4px 8px;
      font-size: 11px;
    }
    
    .empty-msg {
      color: #45475a;
      text-align: center;
      padding: 40px;
    }
    
    .info {
      font-size: 11px;
      color: #6c7086;
      padding: 8px;
      background: #252535;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔍 外部フレーズ集検索</h1>
      <span class="status" id="status">ファイル未読込</span>
    </div>
    
    <div class="controls">
      <div class="file-section">
        <button id="btn-select-file">📂 CSVを選択</button>
        <span class="file-name" id="file-name">ファイル未選択</span>
        <input type="file" id="file-input" accept=".csv">
      </div>
      
      <div class="search-section">
        <input type="text" id="search-input" placeholder="キーワードで検索...">
        <div class="search-type">
          <button class="type-btn active" data-type="both">全て</button>
          <button class="type-btn" data-type="jp">日本語</button>
          <button class="type-btn" data-type="en">英語</button>
        </div>
      </div>
      
      <div class="info" id="info">ファイルを選択して検索してください。大容量ファイル（221,787行など）も検索可能です。</div>
    </div>
    
    <div class="results" id="results">
      <div class="empty-msg">結果はここに表示されます</div>
    </div>
  </div>
  
  <script src="phrase_search.js"></script>
</body>
</html>
