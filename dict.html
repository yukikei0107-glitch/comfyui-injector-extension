<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>プロンプト辞書</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #1e1e2e;
      color: #cdd6f4;
      font-family: "Helvetica Neue", sans-serif;
      scrollbar-gutter: stable;
      overflow: hidden;
    }
    .container {
      display: flex;
      height: 100vh;
      gap: 0;
      overflow: hidden;
    }

    /* 入力候補サジェスト */
    .suggest-box {
      position: absolute;
      z-index: 1000;
      left: 0;
      right: 0;
      top: 100%;
      margin-top: 2px;
      background: #2a2a3e;
      border: 1px solid #45475a;
      border-radius: 8px;
      max-height: 220px;
      overflow-y: auto;
      box-shadow: 0 6px 18px rgba(0,0,0,0.45);
    }
    .suggest-item {
      padding: 8px 12px;
      font-size: 12px;
      color: #cdd6f4;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .suggest-item:hover,
    .suggest-item.active {
      background: #45475a;
    }

    /* 左：変換パネル */
    .panel-left {
      width: 380px;
      flex: 0 0 380px;
      border-right: 1px solid #313244;
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 14px;
      overflow: hidden;
    }
    .panel-title {
      font-size: 14px;
      font-weight: bold;
      color: #89b4fa;
    }
    input[type="text"], textarea {
      width: 100%;
      background: #2a2a3e;
      color: #cdd6f4;
      border: 1px solid #45475a;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      outline: none;
    }
    input[type="text"]:focus, textarea:focus { border-color: #89b4fa; }
    textarea { resize: vertical; min-height: 100px; line-height: 1.6; }

    .result-box {
      background: #2a2a3e;
      border: 1px solid #45475a;
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      min-height: 80px;
      line-height: 1.7;
      color: #a6e3a1;
      word-break: break-word;
      overflow-wrap: break-word;
      white-space: normal;
      width: 100%;
      box-sizing: border-box;
    }
    .result-box.empty { color: #45475a; }

    button {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    .btn-primary { background: #89b4fa; color: #1e1e2e; width: 100%; }
    .btn-copy { background: #45475a; color: #cdd6f4; width: 100%; }
    .btn-success { background: #a6e3a1; color: #1e1e2e; }
    .btn-danger { background: #f38ba8; color: #1e1e2e; }
    .btn-small { padding: 6px 10px; font-size: 11px; }
    /* インポート/エクスポートのコンパクトボタン */
    .iebtn { padding: 7px 8px; border: none; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; background: #45475a; color: #cdd6f4; width: 100%; }
    .iebtn:hover { opacity: 0.85; }
    .iebtn-pink { background: #f38ba8; color: #1e1e2e; }
    .iebtn-purple { background: #cba6f7; color: #1e1e2e; }
    details > summary::-webkit-details-marker { display: none; }
    details[open] > summary { color: #89b4fa; }

    label { font-size: 11px; color: #bac2de; }

    /* 右：辞書管理パネル */
    .panel-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 14px;
      overflow: hidden;
    }
    .add-row {
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .add-row input { flex: 1; }
    .add-row textarea { flex: 2; min-height: 60px; }

    .dict-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }
    .dict-item {
      background: #2a2a3e;
      border: 1px solid #313244;
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      width: 100%;
      min-height: 45px;
      max-height: 80px;
    }
    .dict-item .ja {
      flex: 0 0 150px;
      font-size: 13px;
      font-weight: bold;
      color: #89b4fa;
      word-break: break-word;
      overflow-wrap: break-word;
      overflow: hidden;
      text-overflow: ellipsis;
      max-height: 60px;
    }
    .dict-item .en {
      flex: 1;
      font-size: 12px;
      color: #cdd6f4;
      line-height: 1.4;
      word-break: break-word;
      overflow-wrap: break-word;
      white-space: normal;
      min-width: 0;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .dict-item .actions {
      flex: 0 0 auto;
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .search-box {
      display: flex;
      gap: 8px;
    }
    .search-box input { flex: 1; }
    .empty-msg {
      color: #45475a;
      font-size: 13px;
      text-align: center;
      padding: 40px;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- 左：変換 -->
    <div class="panel-left">
      <!-- LLMタイトル -->
      <div class="panel-title">⚙️ AIバックエンド</div>

      <!-- LLM設定 -->
      <div style="margin-bottom:10px;padding:8px;background:#313244;border-radius:4px;">
        <!-- バックエンド選択 -->
        <div style="display:flex;gap:4px;margin-bottom:4px;">
          <select id="llm-backend" style="flex:1;padding:4px;background:#2a2a3e;color:#cdd6f4;border:1px solid #45475a;border-radius:4px;font-size:10px;">
            <option value="ollama">Ollama</option>
            <option value="lmstudio">LM Studio</option>
          </select>
        </div>
        <!-- サーバーURL -->
        <div style="display:flex;gap:4px;margin-bottom:4px;">
          <input type="text" id="llm-server-url" placeholder="http://localhost:1234" value="http://localhost:12345" style="flex:1;padding:4px;background:#2a2a3e;color:#cdd6f4;border:1px solid #45475a;border-radius:4px;font-size:10px;" />
          <button id="btn-llm-test" style="flex:0 0 auto;padding:4px 8px;background:#45475a;color:#cdd6f4;border:none;border-radius:4px;cursor:pointer;font-size:9px;">確認</button>
        </div>
        <!-- モデル名 -->
        <div style="display:flex;gap:4px;margin-bottom:4px;">
          <input type="text" id="llm-model" placeholder="モデル名" value="" style="flex:1;padding:4px;background:#2a2a3e;color:#cdd6f4;border:1px solid #45475a;border-radius:4px;font-size:10px;" />
        </div>
        <div id="llm-status" style="font-size:9px;color:#6c7086;text-align:center;padding:2px;">未接続</div>
      </div>

      <!-- ComfyUIサーバー -->
      <div class="panel-title">🖥 ComfyUIサーバー</div>
      <div style="margin-bottom:10px;padding:8px;background:#313244;border-radius:4px;">
        <div style="display:flex;gap:4px;">
          <input type="text" id="comfy-base-input" placeholder="http://localhost:8188" spellcheck="false" autocomplete="off" style="flex:1;padding:4px;background:#2a2a3e;color:#cdd6f4;border:1px solid #45475a;border-radius:4px;font-size:10px;" />
        </div>
        <div id="comfy-base-status" style="font-size:9px;color:#6c7086;text-align:center;padding:2px;">画像生成・履歴の接続先</div>
      </div>

      <!-- キーワード変換タイトル -->
      <div class="panel-title" style="margin-top:12px;">🔤 キーワード変換</div>

      <div>
        <label>日本語キーワード</label>
        <div style="display:flex;gap:6px;">
        <input type="text" id="search-input" placeholder="例：イリヤ" style="flex:1;" />
        <button id="btn-clear-search" style="flex:0 0 auto;padding:8px 12px;background:#45475a;color:#cdd6f4;border:none;border-radius:6px;cursor:pointer;font-size:13px;">✕</button>
      </div>
      </div>

      <div>
        <label>変換結果</label>
        <div style="position:relative;">
        <div class="result-box empty" id="result-box">キーワードを入力してください</div>
        <div class="suggest-box" id="suggest-box-en" style="display:none;"></div>
      </div>
      </div>

      <button class="btn-copy" id="btn-copy">📋 結果をコピー</button>
      <button class="btn-copy" id="btn-ai-suggest-dict" style="background:#a6a1de;margin-top:6px;">🤖 AI推奨</button>

      <hr style="border-color:#313244;">

      <div class="panel-title" style="font-size:12px;color:#bac2de;">最近の変換履歴</div>
      <div id="history-list" style="font-size:12px;color:#6c7086;line-height:2;flex:1;min-height:0;overflow-y:auto;">
        （まだ変換していません）
      </div>
    </div>

    <!-- 右：辞書管理 -->
    <div class="panel-right">
      <div class="panel-title">📚 辞書管理 <span id="dict-count" style="color:#6c7086;font-size:11px;">(0件)</span></div>

      <!-- 追加フォーム -->
      <div>
        <label style="margin-bottom:6px;display:block;">新しいエントリを追加</label>
        <div class="add-row">
          <input type="text" id="add-ja" placeholder="日本語キーワード" />
          <div style="position:relative;flex:2;">
            <textarea id="add-en" placeholder="対応する英語プロンプト" style="width:100%;min-height:60px;resize:vertical;"></textarea>
            <div class="suggest-box" id="suggest-box-add-en" style="display:none;"></div>
          </div>
          <button class="btn-success btn-small" id="btn-add" style="align-self:center;">追加</button>
        </div>
      </div>

      <!-- 検索 -->
      <div class="search-box">
        <input type="text" id="filter-input" placeholder="🔍 絞り込み..." />
      </div>

      <!-- 辞書リスト -->
      <div class="dict-list" id="dict-list">
        <div class="empty-msg">辞書が空です。エントリを追加してください。</div>
      </div>

      <!-- データ管理（普段は折りたたみ） -->
      <div style="display:flex;flex-direction:column;gap:6px;flex:0 0 auto;">

        <!-- 永久保存（同梱データへ焼き込み）：常時表示 -->
        <div style="display:flex;gap:6px;align-items:center;background:#181825;padding:6px 8px;border-radius:6px;">
          <span style="font-size:11px;color:#bac2de;flex:0 0 auto;">📌 永久保存</span>
          <button class="iebtn iebtn-purple" id="btn-export-bundle" style="flex:0 0 auto;width:auto;">同梱用に書き出す</button>
          <span style="font-size:10px;color:#6c7086;flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">dict_data.js を拡張フォルダに上書き→リロード</span>
        </div>

        <!-- 自動保存：常時表示（よく見るので） -->
        <div style="display:flex;gap:6px;align-items:center;background:#181825;padding:6px 8px;border-radius:6px;">
          <span style="font-size:11px;color:#bac2de;flex:0 0 auto;">💽 自動保存</span>
          <button class="iebtn" id="btn-autosave-set" style="flex:0 0 auto;width:auto;">保存先を設定</button>
          <button class="iebtn iebtn-pink" id="btn-autosave-off" style="flex:0 0 auto;width:auto;display:none;">🔴 自動保存を解除</button>
          <button class="iebtn" id="btn-load-from-file" style="flex:0 0 auto;width:auto;">📂 ファイルから読込</button>
          <span id="autosave-status" style="font-size:10px;color:#6c7086;flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">未設定</span>
        </div>

        <!-- インポート/エクスポート：折りたたみ -->
        <details style="background:#181825;border-radius:6px;">
          <summary style="cursor:pointer;font-size:11px;color:#bac2de;padding:6px 8px;list-style:none;user-select:none;">📁 インポート / エクスポート</summary>
          <div style="display:flex;flex-direction:column;gap:6px;padding:0 8px 8px;">
            <div>
              <div style="font-size:10px;color:#6c7086;margin:2px 0 4px;">📥 インポート</div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
                <button class="iebtn" id="btn-import-json-fav">お気に入り / 履歴 JSON</button>
                <button class="iebtn" id="btn-import-yaml">タグ辞書 YAML</button>
                <button class="iebtn" id="btn-import-phrases">フレーズ集 CSV</button>
                <button class="iebtn" id="btn-import-text">📝 テキストペースト</button>
              </div>
              <input type="file" id="json-fav-file-input" accept=".json" style="display:none;">
              <input type="file" id="yaml-file-input" accept=".yaml,.yml" style="display:none;">
              <input type="file" id="phrases-file-input" accept=".csv" style="display:none;">
            </div>
            <div>
              <div style="font-size:10px;color:#6c7086;margin:2px 0 4px;">📤 エクスポート / バックアップ</div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
                <button class="iebtn" id="btn-export">JSON</button>
                <button class="iebtn" id="btn-export-text">テキスト</button>
                <button class="iebtn iebtn-pink" id="btn-backup">💾 バックアップ</button>
                <button class="iebtn iebtn-purple" id="btn-restore">♻️ 復元</button>
              </div>
              <input type="file" id="restore-file-input" accept=".json" style="display:none;">
            </div>
          </div>
        </details>
      </div>
    </div>
  </div>

  <div id="toast" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#a6e3a1;color:#1e1e2e;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:bold;box-shadow:0 4px 16px rgba(0,0,0,0.4);opacity:0;pointer-events:none;transition:opacity 0.2s, transform 0.2s;z-index:9999;"></div>
  <script src="config.js"></script>
  <script src="dict_data.js"></script>
  <script src="dict.js"></script>
</body>
</html>
